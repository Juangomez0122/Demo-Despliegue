name:   Comprobar scripts y preparar version para despliegue

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  preparar:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Ejecutar script
        shell: pwsh
        run: ./desplegar.ps1 -RutaPHP 'php' -IniciarServidor:$false

      - name: Guardar version preparada
        uses: actions/upload-artifact@v4
        with:
          name: version-preparada
          path: pruebas/index.php
          if-no-files-found: error